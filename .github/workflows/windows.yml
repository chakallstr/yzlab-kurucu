name: Windows kurucu

on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**']
  workflow_dispatch:
  release:
    # `gh release create` ile dogrudan yayinlanan release'te `created` TETIKLENMEDI (09-15);
    # `published` guvenilir olan.
    types: [published, created]

jobs:
  derle-ve-sina:
    runs-on: windows-latest
    # Release'e dosya eklemek icin GITHUB_TOKEN'a yazma izni sart (v0.1.1'de 403).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Derle (tek dosya, self-contained)
        run: dotnet publish windows/src/YzlabKurucu.csproj -c Release -o out

      - name: Kendi kendini sina
        # ⚠️ WinExe: PowerShell beklemez ve cikis kodunu okumaz → Start-Process -Wait -PassThru.
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./out/YzlabKurucu.exe -ArgumentList '--selftest' `
                             -NoNewWindow -Wait -PassThru
          Write-Host "selftest cikis kodu: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "kendi kendini sinama BASARISIZ" }

      - name: Exe bilgisi
        run: |
          Get-Item out/YzlabKurucu.exe | Select-Object Name,Length,LastWriteTime
          (Get-Item out/YzlabKurucu.exe).VersionInfo | Format-List ProductName,FileVersion

      - uses: actions/upload-artifact@v4
        with:
          name: YzlabKurucu-exe
          path: out/YzlabKurucu.exe
          if-no-files-found: error

      - name: Release'e ekle
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/YzlabKurucu.exe

  # GERCEK ANAHTARLA UCTAN UCA (v0.2 masaustu yolu): kurucu config.toml'a isaretli blok yazar,
  # auth.json'a (ChatGPT girisi) DOKUNMAZ; PROFILSIZ codex exec bize gitmeli (masaustu ayni dosyayi okur).
  # Sonra anahtar modu (auth.json apikey, yedekli) ve geri al. Anahtar: repo secret YZLAB_TEST_KEY.
  uctan-uca:
    name: Gercek anahtarla uctan uca
    needs: derle-ve-sina
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YzlabKurucu-exe
          path: out

      - name: Kur (masaustu yolu) → profilsiz kanit → anahtar modu → geri al
        shell: pwsh
        env:
          YZLAB_ANAHTAR: ${{ secrets.YZLAB_TEST_KEY }}
        run: |
          if (-not $env:YZLAB_ANAHTAR) { Write-Host "::warning::YZLAB_TEST_KEY tanimli degil, ATLANDI"; exit 0 }
          function Norm($s) { if ($null -eq $s) { return "" }; return ($s -replace "`r`n", "`n").Trim() }
          function ProjelerSiz($s) { return (Norm ((($s -replace "`r`n", "`n") + "`n") -replace '(?m)^\[projects\.[^\n]*\n(?:(?!\[)[^\n]*\n)*', '')) }

          $h = Join-Path $env:RUNNER_TEMP "codex-home"
          New-Item -ItemType Directory -Force $h | Out-Null
          $cfg0  = "model = `"kendi-modelim`"`n`n[mcp_servers.foo]`ncommand = `"bar`"`n"
          $auth0 = '{"auth_mode":"chatgpt"}'
          [IO.File]::WriteAllText("$h\config.toml", $cfg0)
          [IO.File]::WriteAllText("$h\auth.json", $auth0)
          $env:CODEX_HOME = $h
          $c = Join-Path $env:RUNNER_TEMP "claude-home"
          New-Item -ItemType Directory -Force $c | Out-Null
          $settings0 = "{`n  `"permissions`": {`"allow`": [`"Bash`"]},`n  `"env`": {`"ANTHROPIC_API_KEY`": `"sk-eski`"},`n  `"theme`": `"dark`"`n}`n"
          [IO.File]::WriteAllText("$c\settings.json", $settings0)
          $env:CLAUDE_CONFIG_DIR = $c

          Write-Host "kurulum oncesi codex var mi: $([bool](Get-Command codex -ErrorAction SilentlyContinue))  claude var mi: $([bool](Get-Command claude -ErrorAction SilentlyContinue))"

          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath ./out/YzlabKurucu.exe -ArgumentList '--kur','--model','gpt-5.6-luna','--claude','1' -NoNewWindow -Wait -PassThru
          Write-Host "kur cikis kodu: $($p.ExitCode)  sure: $([int]$sw.Elapsed.TotalSeconds) sn"
          if ($p.ExitCode -ne 0) { throw "kurulum BASARISIZ" }

          # --- Codex (masaustu yolu) invaryantlari ---
          $cfg1 = [IO.File]::ReadAllText("$h\config.toml")
          if ($cfg1 -notmatch '# >>> YapayZekaLab kurucu: ust ayarlar') { throw "isaretli blok yok" }
          if ($cfg1 -notmatch 'model_provider = "yapayzekalab"')         { throw "model_provider yazilmadi" }
          if ($cfg1 -notmatch '\[model_providers\.yapayzekalab\]')       { throw "saglayici tablosu yok" }
          if ($cfg1 -notmatch '\[mcp_servers\.foo\]')                    { throw "musterinin tablosu kayboldu" }
          if ($cfg1 -match 'kendi-modelim')                               { throw "eski model satiri kalmis (cift anahtar)" }
          if ($cfg1 -match 'requires_openai_auth')                        { throw "hesap modunda requires_openai_auth olmamali" }
          if ([IO.File]::ReadAllText("$h\auth.json") -ne $auth0)          { throw "auth.json DEGISTI (hesap modu)" }
          if (-not (Test-Path "$h\yzlab-kurucu-yedek.json"))             { throw "yedek json yok" }
          if (Test-Path "$h\yzlab.config.toml")                           { throw "profil dosyasi yazilmis" }
          $kat = Get-Content "$h\yzlab-model-catalog.json" -Raw | ConvertFrom-Json
          Write-Host "katalog model sayisi: $($kat.models.Count)"
          if ($kat.models.Count -lt 1) { throw "katalog bos" }

          # --- Claude Code invaryantlari ---
          if ([IO.File]::ReadAllText("$c\settings.json.bak-yzlab") -ne $settings0) { throw "claude yedek birebir degil" }
          $sj = Get-Content "$c\settings.json" -Raw | ConvertFrom-Json
          if ($sj.theme -ne 'dark' -or -not $sj.permissions) { throw "claude diger anahtarlar kayboldu" }
          if ($sj.env.PSObject.Properties.Name -contains 'ANTHROPIC_API_KEY') { throw "kalinti ANTHROPIC_API_KEY silinmedi" }
          if ($sj.env.ANTHROPIC_BASE_URL -ne 'https://yapayzekalab.org') { throw "claude BASE_URL yanlis" }
          if ($sj.env.ANTHROPIC_AUTH_TOKEN -ne $env:YZLAB_ANAHTAR) { throw "claude AUTH_TOKEN yanlis" }
          $lnk2 = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Claude Code (YapayZekaLab).lnk'
          if (-not (Test-Path $lnk2)) { throw "claude kisayol yok" }
          Write-Host "claude settings.json env OK"

          # --- bagimsiz kanit: PROFILSIZ codex exec (masaustunun okudugu ana config) ---
          npm install -g @openai/codex 2>&1 | Select-Object -Last 1 | Out-String | Write-Host
          $out = & cmd /d /s /c "codex exec --skip-git-repo-check -C `"$env:RUNNER_TEMP`" `"Sadece ok yaz`" < NUL 2>&1" | Out-String
          Write-Host ($out -replace [regex]::Escape($env:YZLAB_ANAHTAR), 'KEY')
          if ($out -notmatch 'provider: yapayzekalab') { throw "codex (profilsiz) bize gitmedi" }
          $cfgExec = [IO.File]::ReadAllText("$h\config.toml")
          if ((ProjelerSiz $cfgExec) -ne (ProjelerSiz $cfg1)) { Write-Host $cfgExec; throw "config.toml'a [projects] disinda dokunuldu" }
          Write-Host "codex (profilsiz, ana config): provider yapayzekalab ✓"

          # --- bagimsiz kanit: claude (OAuth yok, kabukta sahte API_KEY) ---
          Push-Location $env:RUNNER_TEMP
          $env:ANTHROPIC_API_KEY = 'sk-ant-SAHTE'
          $outc = & cmd /d /s /c "claude -p `"Sadece ok yaz`" --output-format json < NUL 2>&1" | Out-String
          Remove-Item Env:\ANTHROPIC_API_KEY
          Pop-Location
          if ($outc -notmatch '"stop_reason"' -or $outc -match '"is_error":true') { Write-Host $outc; throw "claude -p beklenmedik yanit" }
          Write-Host "claude -p bize gitti ✓"

          # --- anahtarla giris modu ---
          $p3 = Start-Process -FilePath ./out/YzlabKurucu.exe -ArgumentList '--kur','--model','gpt-5.6-luna','--anahtar-giris','1' -NoNewWindow -Wait -PassThru
          if ($p3.ExitCode -ne 0) { throw "anahtar modu kurulum BASARISIZ" }
          $aj = Get-Content "$h\auth.json" -Raw | ConvertFrom-Json
          if ($aj.auth_mode -ne 'apikey' -or $aj.OPENAI_API_KEY -ne $env:YZLAB_ANAHTAR) { throw "anahtar modu: auth.json apikey degil" }
          if ([IO.File]::ReadAllText("$h\auth.json.bak-yzlab") -ne $auth0) { throw "anahtar modu: auth yedegi birebir degil" }
          if ([IO.File]::ReadAllText("$h\config.toml") -notmatch 'requires_openai_auth = true') { throw "anahtar modu: requires_openai_auth yok" }
          $out3 = & cmd /d /s /c "codex exec --skip-git-repo-check -C `"$env:RUNNER_TEMP`" `"Sadece ok yaz`" < NUL 2>&1" | Out-String
          if ($out3 -notmatch 'provider: yapayzekalab') { Write-Host ($out3 -replace [regex]::Escape($env:YZLAB_ANAHTAR), 'KEY'); throw "anahtar modunda codex bize gitmedi" }
          Write-Host "anahtar modu ✓"

          # --- geri al ---
          $p2 = Start-Process -FilePath ./out/YzlabKurucu.exe -ArgumentList '--geri-al' -NoNewWindow -Wait -PassThru
          Write-Host "geri al cikis kodu: $($p2.ExitCode)"
          if ($p2.ExitCode -ne 0) { throw "geri al basarisiz" }
          if ([IO.File]::ReadAllText("$h\auth.json") -ne $auth0) { throw "geri al: auth.json geri gelmedi" }
          $cfgSon = [IO.File]::ReadAllText("$h\config.toml")
          if ((ProjelerSiz $cfgSon) -ne (Norm $cfg0)) { Write-Host $cfgSon; throw "geri al: config.toml onceki hali degil" }
          if (Test-Path "$h\yzlab-kurucu-yedek.json") { throw "geri al: yedek json kaldi" }
          if (Test-Path "$h\yzlab-model-catalog.json") { throw "geri al: katalog kaldi" }
          if ([IO.File]::ReadAllText("$c\settings.json") -ne $settings0) { throw "geri al: claude settings.json birebir degil" }
          if (Test-Path "$c\settings.json.bak-yzlab") { throw "geri al: claude yedegi kaldi" }
          if (Test-Path $lnk2) { throw "geri al: claude kisayolu kaldi" }
          Write-Host "✓ uctan uca TAM (masaustu yolu + anahtar modu + Claude Code): kur + kanit + geri al"

  # NODE YOKKEN yol (yalniz Claude Code Node ister; Codex yolu Node'suz): bilgi amacli.
  node-yokken:
    name: Node yokken (Claude MSI yolu, bilgi)
    needs: derle-ve-sina
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YzlabKurucu-exe
          path: out

      - name: Node'u kaldir, PATH'ten sil, kurucuyu calistir
        shell: pwsh
        env:
          YZLAB_ANAHTAR: ${{ secrets.YZLAB_TEST_KEY }}
        run: |
          if (-not $env:YZLAB_ANAHTAR) { Write-Host "::warning::YZLAB_TEST_KEY yok, atlandi"; exit 0 }
          $urun = Get-CimInstance Win32_Product -Filter "Name like 'Node.js%'" -ErrorAction SilentlyContinue
          if ($urun) { Write-Host "kaldiriliyor: $($urun.Name) $($urun.Version)"; $null = $urun | Invoke-CimMethod -MethodName Uninstall }
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notmatch 'node|npm' }) -join ';'
          [Environment]::SetEnvironmentVariable('PATH', (([Environment]::GetEnvironmentVariable('PATH','Machine') -split ';') | Where-Object { $_ -notmatch 'node|npm' }) -join ';', 'Machine')
          Write-Host "node var mi: $([bool](Get-Command node -ErrorAction SilentlyContinue))"
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "codex-home2"; New-Item -ItemType Directory -Force $env:CODEX_HOME | Out-Null
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "claude-home2"; New-Item -ItemType Directory -Force $env:CLAUDE_CONFIG_DIR | Out-Null
          $p = Start-Process -FilePath ./out/YzlabKurucu.exe -ArgumentList '--kur','--model','gpt-5.6-luna','--claude','1' -NoNewWindow -Wait -PassThru
          Write-Host "kur cikis kodu: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Node-yokken kurulum BASARISIZ" }
          Write-Host "✓ Node yokken yol TAM (MSI + npm claude + dogrulama)"
